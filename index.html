<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <title>Java Script aula 05 - Canvas</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="canvas.css">
</head>

<body>

    <h2>Trabalhando com o Canvas - 2D</h2>

    <canvas id="myCanvas" width="300" height="300" style="border: 3px solid palevioletred;">
        Seu browser não suporta a tag do canvas.
    </canvas>
    <br>
    <button id="btnline" onclick="linha();">Linha</button>
    <button id="btncirc" onclick="circulo();">Círculo</button>
    <button id="btnrect" onclick="retangulofixo();">Retangulo fixo</button>
    <button id="btnclean" onclick="limparCanvas();">Limpar</button>

    <h2>Canvas dentro das divs</h2>

    <div class="painel">
        <div class="card">
            <h3>Canvas A</h3>
            <canvas id="canvasA" width="300" height="300" style="border: 3px solid blueviolet;">
                Seu browser não suporta a tag do canvas.
            </canvas>
        </div>

        <div class="card">
            <h3>Canvas B</h3>
            <canvas id="canvasB" width="300" height="300" style="border: 3px solid blue;">
                Seu browser não suporta a tag do canvas.
            </canvas>
        </div>
    </div>

    <h2>Desenhar e apagar com o mouse</h2>

    <canvas id="quadro" width="400" height="400" style="border: 3px solid black;">
        Seu browser não suporta a tag do canvas.
    </canvas>
    <br>
    <button onclick="selecionarFerramenta('linha')">Linha</button>
    <button onclick="selecionarFerramenta('circulo')">Círculo</button>
    <button onclick="selecionarFerramenta('retangulo')">Retângulo</button>
    <button onclick="selecionarFerramenta('borracha')">Borracha</button>
    <button onclick="limparQuadro()">Limpar Tudo</button>

    <p id="status">Ferramenta atual: linha</p>

    <script src="canvas.js"></script>
</body>

</html>
